<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="jarGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sucBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="sucGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#sucGlow)" />
  <ellipse cx="120" cy="216" rx="75" ry="12" fill="#000000" opacity="0.25" />
  
  <!-- Base Castors -->
  <circle cx="68" cy="208" r="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="172" cy="208" r="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Main Chassis Base (Epoxy Coated) -->
  <rect x="52" y="140" width="136" height="66" rx="10" fill="url(#sucBody)" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Push Handle Stainless Tubing -->
  <path d="M 52 145 L 36 145 L 36 65 Q 36 50 50 50 L 58 50" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Front Vacuum Regulator Dial -->
  <circle cx="95" cy="172" r="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <line x1="95" y1="172" x2="102" y2="166" stroke="#22c55e" stroke-width="2"/>
  <circle cx="95" cy="172" r="3" fill="#0f172a"/>
  <text x="88" y="193" font-family="monospace" font-size="6.5" font-weight="bold" fill="#334155">-0.09MPa</text>
  
  <!-- Power Switch & Pilot Lamp -->
  <rect x="135" y="162" width="20" height="12" rx="3" fill="#0f172a"/>
  <circle cx="145" cy="168" r="3" fill="#22c55e"/>
  
  <!-- Dual 2.5L Polycarbonate Suction Jars (Top Deck) -->
  <!-- Left Jar -->
  <rect x="64" y="60" width="48" height="78" rx="8" fill="url(#jarGlass)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="60" y="54" width="56" height="10" rx="3" fill="#334155"/>
  <!-- Graduation marks -->
  <line x1="72" y1="80" x2="80" y2="80" stroke="#0284c7" stroke-width="1"/>
  <line x1="72" y1="95" x2="84" y2="95" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="72" y1="110" x2="80" y2="110" stroke="#0284c7" stroke-width="1"/>
  <line x1="72" y1="125" x2="84" y2="125" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="66" y="100" width="44" height="36" rx="4" fill="#0284c7" opacity="0.25"/>
  
  <!-- Right Jar -->
  <rect x="128" y="60" width="48" height="78" rx="8" fill="url(#jarGlass)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="124" y="54" width="56" height="10" rx="3" fill="#334155"/>
  <line x1="136" y1="80" x2="144" y2="80" stroke="#0284c7" stroke-width="1"/>
  <line x1="136" y1="95" x2="148" y2="95" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="136" y1="110" x2="144" y2="110" stroke="#0284c7" stroke-width="1"/>
  
  <!-- Silicone Suction Tubing interconnects -->
  <path d="M 88 54 Q 120 28 152 54" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>
  <path d="M 152 54 Q 185 45 195 85" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>
  <!-- Overflow Safety Float Valve -->
  <circle cx="88" cy="70" r="5" fill="#f59e0b"/>
  <circle cx="152" cy="70" r="5" fill="#f59e0b"/>
</svg>