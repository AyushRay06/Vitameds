<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bedFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bedMattress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="bedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#bedGlow)" />
  <ellipse cx="120" cy="216" rx="95" ry="12" fill="#000000" opacity="0.25" />
  
  <!-- Under-bed Chassis Base -->
  <rect x="45" y="172" width="150" height="10" rx="3" fill="#475569"/>
  <!-- Central Columns -->
  <rect x="80" y="145" width="16" height="30" fill="#94a3b8" rx="2"/>
  <rect x="144" y="145" width="16" height="30" fill="#94a3b8" rx="2"/>
  
  <!-- 4 Heavy Duty Castor Wheels -->
  <circle cx="58" cy="192" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="58" cy="192" r="4" fill="#f8fafc"/>
  <circle cx="182" cy="192" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="182" cy="192" r="4" fill="#f8fafc"/>
  <circle cx="100" cy="190" r="8" fill="#475569"/>
  <circle cx="140" cy="190" r="8" fill="#475569"/>
  
  <!-- Articulated Bed Frame (Fowler / Trendelenburg Tilt) -->
  <!-- Backrest tilted up slightly -->
  <path d="M 32 144 L 85 118 L 140 135 L 208 135" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Blue Medical Mattress Sections -->
  <!-- Head Section -->
  <path d="M 34 140 L 85 114 L 88 126 L 37 150 Z" fill="url(#bedMattress)" stroke="#0369a1" stroke-width="1.5"/>
  <!-- Knee / Foot Section -->
  <path d="M 88 126 L 142 143 L 206 143 L 206 130 L 142 130 L 88 114 Z" fill="url(#bedMattress)" stroke="#0369a1" stroke-width="1.5"/>
  
  <!-- Headboard (ABS Polymer) -->
  <rect x="24" y="90" width="14" height="65" rx="5" fill="url(#bedFrame)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Footboard -->
  <rect x="202" y="105" width="14" height="50" rx="5" fill="url(#bedFrame)" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Split ABS Side Safety Rails -->
  <rect x="52" y="96" width="46" height="26" rx="6" fill="url(#bedFrame)" stroke="#64748b" stroke-width="1.8"/>
  <line x1="68" y1="99" x2="68" y2="119" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="82" y1="99" x2="82" y2="119" stroke="#94a3b8" stroke-width="1.5"/>
  
  <rect x="115" y="106" width="46" height="26" rx="6" fill="url(#bedFrame)" stroke="#64748b" stroke-width="1.8"/>
  <line x1="131" y1="109" x2="131" y2="129" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="145" y1="109" x2="145" y2="129" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Telescopic IV Infusion Pole -->
  <line x1="40" y1="130" x2="40" y2="45" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 50 Q 40 42 40 45 Q 40 42 48 50" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="30" y="58" width="6" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
</svg>