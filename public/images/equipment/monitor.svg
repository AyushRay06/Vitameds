<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="monBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="monScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="baseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00a884" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00a884" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ambient Backlight -->
  <circle cx="120" cy="120" r="105" fill="url(#baseGlow)" />
  <!-- Shadow -->
  <ellipse cx="120" cy="216" rx="80" ry="14" fill="#000000" opacity="0.25" />
  
  <!-- Main Case -->
  <rect x="35" y="40" width="170" height="150" rx="14" fill="url(#monBody)" stroke="#94a3b8" stroke-width="2" />
  <!-- Top Handle -->
  <path d="M 85 40 Q 85 24 100 24 L 140 24 Q 155 24 155 40" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Screen Bezel -->
  <rect x="45" y="52" width="118" height="126" rx="6" fill="url(#monScreen)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Waveforms on Screen -->
  <!-- ECG (Green) -->
  <path d="M 50 78 L 70 78 L 74 72 L 78 84 L 83 62 L 87 90 L 91 78 L 105 78 L 109 72 L 113 84 L 118 62 L 122 90 L 126 78 L 155 78" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <!-- Pleth / SpO2 (Blue) -->
  <path d="M 50 112 Q 62 94 72 112 T 94 112 T 116 112 T 138 112 T 155 112" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- Resp (Cyan) -->
  <path d="M 50 146 Q 65 132 80 146 T 110 146 T 140 146 T 155 146" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  
  <!-- Screen Readouts -->
  <text x="135" y="72" font-family="monospace" font-size="11" font-weight="bold" fill="#22c55e">HR 72</text>
  <text x="132" y="106" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">99%</text>
  <text x="125" y="140" font-family="monospace" font-size="9" font-weight="bold" fill="#f59e0b">120/80</text>
  <text x="52" y="65" font-family="sans-serif" font-size="7" font-weight="bold" fill="#94a3b8">ECG II x1.0</text>
  
  <!-- Right Control Panel -->
  <circle cx="185" cy="85" r="11" fill="#475569" stroke="#334155" stroke-width="2"/>
  <circle cx="185" cy="85" r="4" fill="#94a3b8"/>
  <rect x="175" y="112" width="20" height="7" rx="3.5" fill="#22c55e"/>
  <rect x="175" y="125" width="20" height="7" rx="3.5" fill="#f59e0b"/>
  <rect x="175" y="138" width="20" height="7" rx="3.5" fill="#ef4444"/>
  <!-- Connector Ports Bottom Right -->
  <circle cx="178" cy="162" r="3" fill="#334155"/>
  <circle cx="190" cy="162" r="3" fill="#334155"/>
</svg>