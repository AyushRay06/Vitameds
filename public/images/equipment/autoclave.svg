<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="ssSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="lidGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="autoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#autoGlow)" />
  <ellipse cx="120" cy="218" rx="70" ry="12" fill="#000000" opacity="0.25" />
  
  <!-- 3 Heavy Duty Leg Stands -->
  <path d="M 70 170 L 60 216 L 68 216 L 76 170 Z" fill="#475569"/>
  <path d="M 170 170 L 180 216 L 172 216 L 164 170 Z" fill="#475569"/>
  <rect x="114" y="170" width="12" height="46" fill="#334155"/>
  
  <!-- Main Cylindrical Vessel Body (SS 304) -->
  <rect x="65" y="80" width="110" height="105" rx="8" fill="url(#ssSteel)" stroke="#475569" stroke-width="2"/>
  
  <!-- Rib Belts & Flanges -->
  <rect x="62" y="76" width="116" height="9" rx="3" fill="#475569"/>
  <rect x="63" y="125" width="114" height="6" fill="#64748b" opacity="0.6"/>
  <rect x="62" y="178" width="116" height="8" rx="2" fill="#475569"/>
  
  <!-- Domed Heavy Lid -->
  <path d="M 64 76 Q 120 40 176 76 Z" fill="url(#lidGlow)" stroke="#334155" stroke-width="2"/>
  
  <!-- Radial Tightening Wheel (Central Star Clamp) -->
  <circle cx="120" cy="38" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <line x1="120" y1="16" x2="120" y2="60" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <line x1="98" y1="38" x2="142" y2="38" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <line x1="104" y1="22" x2="136" y2="54" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="54" x2="136" y2="22" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="38" r="6" fill="#38bdf8"/>
  
  <!-- Radial Tightening Handles around rim -->
  <rect x="52" y="70" width="14" height="8" rx="3" fill="#1e293b"/>
  <rect x="174" y="70" width="14" height="8" rx="3" fill="#1e293b"/>
  
  <!-- Pressure Dial Manometer Gauge (Left) -->
  <circle cx="78" cy="56" r="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <line x1="78" y1="56" x2="84" y2="50" stroke="#ef4444" stroke-width="1.8"/>
  <circle cx="78" cy="56" r="2" fill="#000000"/>
  <text x="73" y="65" font-family="monospace" font-size="5" fill="#475569">PSI</text>
  
  <!-- Brass Safety Release Valve (Right) -->
  <rect x="156" y="46" width="8" height="18" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
  <circle cx="160" cy="44" r="5" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  
  <!-- Front Water Drainage Cock / Valve -->
  <path d="M 120 186 L 120 200 L 112 200" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Front Brand Badge -->
  <rect x="96" y="105" width="48" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="120" y="117" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#38bdf8">CURE-PRESS</text>
</svg>